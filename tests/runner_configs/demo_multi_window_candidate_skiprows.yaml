# Candidate per-window discard fixture for the real multi-window ../demo dataset.
# This config is for dry-run command review and discard sensitivity only.
# It does not certify sampling convergence, TI direction, free-energy units,
# TST readiness, or production physical correctness.
parameters_confirmed: true

sampling_output_root: ../../../demo
input_file: energy.dat
window_glob: "*"
dataset_label: demo_multi_window_candidate_skiprows
output_dir: ../real_case_records/2026-07-11_candidate_skiprows/output
stop_after: extraction

run_convergence_diagnostics: true
convergence_columns: 2,6,7
convergence_output_dir: ../real_case_records/2026-07-11_candidate_skiprows/convergence
convergence_skiprows: 0
convergence_step_col_index: 0
convergence_running_window: 1000
convergence_auto_equilibration: true
convergence_plot: false

format: table
skiprows: 0
per_window_skiprows_file: demo_multi_window_candidate_skiprows.csv
rc_raw_unit_label: au
force_raw_unit_label: au
rc_scale: 1.0
force_scale: 1.0
rc_index: 0
rc_col_index: 6
force_col_index: 7
uncertainty: sem

notes: reviewed demo per-window discard fixture; production use still requires user visual convergence-plot review; no TI/TST approval

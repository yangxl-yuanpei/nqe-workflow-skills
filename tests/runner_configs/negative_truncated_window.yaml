parameters_confirmed: true

sampling_output_root: fixtures/truncated_windows
input_file: energy.dat
window_glob: "*"
dataset_label: truncated_window_should_fail
output_dir: ../../tmp/runner-negative-truncated-window-output
allow_existing_output_dir: true
